<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F.A.E. — Member Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/fae-motion.css?v=1">
<script src="assets/fae-core.js?v=9"></script>
<script src="assets/fae-export.js?v=1"></script>
<style>
:root{
  --void:#050507; --panel:#0d0d12; --panel2:#121218; --line:#22222b; --line2:#2e2e39;
  --gold:#C9A227; --gold-hi:#E8C766; --ink:#F4F4F6; --mute:#8B8B98; --dim:#5f5f6d;
  --red:#D2453B; --green:#3FA66A; --blue:#4A7FB5; --purple:#8C6BD4;
  --sans:'DM Sans',system-ui,sans-serif; --disp:'Archivo',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--void);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:40px}
.wrap{max-width:1220px;margin:0 auto;padding:20px 18px 40px}
a{color:inherit;text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
     padding-bottom:14px;border-bottom:2px solid var(--gold);margin-bottom:16px}
.brand b{display:block;font-family:var(--disp);font-weight:900;font-size:20px;letter-spacing:.03em;line-height:1.1}
.brand span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--gold);margin-top:5px}
.home{font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--gold);border:1px solid var(--line2);border-radius:6px;padding:8px 12px;white-space:nowrap}
.note{font-size:12px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;line-height:1.5}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input[type=text]{background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:9px;padding:10px 13px;font-size:14px;min-width:230px}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:9px;padding:10px 15px;font-family:var(--disp);font-weight:700;font-size:12.5px;letter-spacing:.03em;cursor:pointer}
.btn.go{background:var(--gold);border-color:var(--gold);color:#100c00}
.count{font-family:var(--mono);font-size:11px;color:var(--mute);margin-left:auto}
/* category filter chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.03em;padding:7px 12px;border-radius:999px;
  border:1px solid var(--line2);background:var(--panel);color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:7px}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.on{color:#100c00;border-color:transparent}
.chip .n{font-family:var(--mono);font-size:10px;opacity:.8}
.chip.add{color:var(--gold);border-style:dashed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.head{display:flex;gap:13px;align-items:flex-start;padding:15px;cursor:pointer}
.head:hover{background:var(--panel2)}
.pic{width:60px;height:60px;border-radius:12px;overflow:hidden;flex:none;background:var(--panel2);
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:900;font-size:20px;color:var(--gold)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.who{min-width:0;flex:1}
.who b{font-size:15px;line-height:1.2;display:inline}
.who .role{font-family:var(--mono);font-size:9px;color:var(--blue);margin-left:6px;letter-spacing:.05em}
.who .id{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.badge{font-size:8.5px;font-weight:800;letter-spacing:.05em;padding:3px 7px;border-radius:8px;text-transform:uppercase;color:#fff}
.badge.act{background:var(--line2);color:var(--mute)}
.bal{font-family:var(--mono);font-size:12px;color:var(--green);white-space:nowrap;text-align:right;flex:none}
.bal.due{color:var(--red)}
.chev{color:var(--dim);font-size:12px;margin-left:4px}
/* expandable contact */
.contact{padding:0 15px 15px 15px;border-top:1px solid var(--line);margin-top:0}
.contact .ct{font-size:12.5px;color:#C7C7D2;line-height:1.8;padding-top:12px}
.contact .k{color:var(--dim);font-family:var(--mono);font-size:9px;letter-spacing:.1em;display:inline-block;min-width:74px}
.contact a.tel{color:var(--gold-hi)}
.catrow{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.catrow label{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.1em}
select{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:7px;padding:6px 9px;font-size:12px;font-family:var(--sans)}
/* nested dependents */
.deps{padding:4px 15px 12px 15px}
.dep{display:flex;align-items:center;gap:10px;padding:9px 11px;margin-top:7px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  border-left:3px solid var(--blue)}
.dep .dp{width:34px;height:34px;border-radius:8px;flex:none;background:var(--void);display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:800;font-size:12px;color:var(--blue);overflow:hidden}
.dep .dp img{width:100%;height:100%;object-fit:cover}
.dep .dn{flex:1;min-width:0}
.dep .dn b{font-size:13px}
.dep .dn .meta{font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:2px}
.dep .dc{font-size:11px;color:#B9B9C5;text-align:right;white-space:nowrap}
.undertag{font-family:var(--mono);font-size:8.5px;color:var(--blue);letter-spacing:.08em;padding:2px 0 2px 2px}
.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--mute);font-size:14px;border:1px dashed var(--line2);border-radius:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);color:var(--ink);border-radius:10px;padding:12px 18px;font-size:13px;z-index:60;display:none}
@media print{
  body{background:#fff;color:#111;padding:0}.wrap{max-width:none;padding:0}
  .top,.bar,.chips,.note,.home,.chev,.catrow{display:none!important}
  .card{background:#fff;border:1px solid #ccc;page-break-inside:avoid}
  .contact{display:block!important}.who b,.contact .ct{color:#111}.pic{background:#eee;color:#333}
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><b>MEMBER PORTAL</b><span>F.A.E. SPORTS · UNIVERSAL DIRECTORY</span></div>
    <a class="home" href="console.html">&#8592; HOME</a>
  </div>

  <div class="note" id="roleNote"></div>

  <div class="bar">
    <input type="text" id="q" placeholder="Search any name, child, phone, email, ID…" oninput="render()">
    <button class="btn" onclick="copyAll()">&#128203; Copy</button>
    <button class="btn" onclick="window.print()">&#128424; Print</button>
    <button class="btn go" onclick="FAEExport.open(this,'portal')">&#8681; Export</button>
    <span class="count" id="count"></span>
  </div>

  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* Member Portal — the ONE place the office views every person across the whole
   business. Reads FAE.directory(): members, court visitor households (minors
   nested UNDER their guardian) and FilAm Elite players, merged to one row per
   human. Click a card to reveal contact for the front desk. Category (Basketball
   Rental / Volleyball Rental / FAE Basketball Batch / FAE Volleyball Batch, plus
   any the office adds) is editable here and saved locally — no PII leaves the device. */
var $ = id => document.getElementById(id);
function toast(m){ var t=$('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2600); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(n){ return String(n||'?').split(' ').map(x=>x[0]||'').join('').slice(0,2).toUpperCase(); }
function telHref(p){ return 'tel:'+String(p||'').replace(/[^0-9+]/g,''); }

var FILTER = 'all';

/* category option list: built-ins + office customs */
function catOptions(){
  var o = Object.keys(FAE.dirCats).map(k=>({key:k,label:FAE.dirCats[k].label}));
  (FAE.directoryCats().custom||[]).forEach(c=>o.push({key:c.key,label:c.label}));
  return o;
}
function catColor(key){ return (FAE.dirCats[key]||FAE.dirCats.other).color; }

/* does a person (or any of their dependents) match the text query? */
function matches(p, q){
  if(!q) return true;
  var hay = [p.name,p.id,p.phone,p.email,p.guardianName].concat((p.activities||[])).join(' ').toLowerCase();
  if(hay.indexOf(q)>=0) return true;
  return (p.dependents||[]).some(d=>[d.name,d.phone,d.email,d.id].join(' ').toLowerCase().indexOf(q)>=0);
}
/* category filter: the card shows if the adult OR any child is in that category */
function inFilter(p){
  if(FILTER==='all') return true;
  if(p.category===FILTER) return true;
  return (p.dependents||[]).some(d=>d.category===FILTER);
}

function activityBadges(acts){
  return (acts||[]).map(a=>`<span class="badge act">${esc(a)}</span>`).join('');
}
function catSelect(p){
  var opts = catOptions().map(o=>`<option value="${o.key}"${o.key===p.category?' selected':''}>${esc(o.label)}</option>`).join('');
  return `<div class="catrow" onclick="event.stopPropagation()">
      <label>CATEGORY</label>
      <select onchange="setCat('${p.key}',this.value)">${opts}</select>
    </div>`;
}
function contactBlock(p){
  return `<div class="ct">
      <div><span class="k">PHONE</span> ${p.phone?`<a class="tel" href="${telHref(p.phone)}">${esc(p.phone)}</a>`:'—'}</div>
      <div><span class="k">EMAIL</span> ${p.email?`<a class="tel" href="mailto:${esc(p.email)}">${esc(p.email)}</a>`:'—'}</div>
      ${p.address?`<div><span class="k">ADDRESS</span> ${esc(p.address)}</div>`:''}
      ${p.guardianName?`<div><span class="k">GUARDIAN</span> ${esc(p.guardianName)}</div>`:''}
      ${p.emergency?`<div><span class="k">EMERGENCY</span> ${esc(p.emergency)} ${esc(p.emergencyPhone||'')}</div>`:''}
      ${p.nfcUid?`<div><span class="k">NFC CARD</span> ${esc(p.nfcUid)}</div>`:''}
      ${p.notes?`<div><span class="k">NOTES</span> ${esc(p.notes)}</div>`:''}
    </div>`;
}
function depRow(d){
  var pic = d.photo?`<img src="${esc(d.photo)}" alt="">`:initials(d.name);
  var line = d.phone||d.email||'';
  return `<div class="dep">
      <div class="dp">${pic}</div>
      <div class="dn"><b>${esc(d.name)}</b>
        <div class="meta">${d.age?('age '+esc(d.age)+' · '):''}${esc(FAE.directoryCatLabel(d.category))}${(d.activities||[]).length?(' · '+d.activities.join(', ')):''}</div></div>
      <div class="dc">${line?esc(line):(d.balance?('₱'+(+d.balance).toLocaleString()):'')}</div>
    </div>`;
}

function card(p){
  var pic = p.photo?`<img src="${esc(p.photo)}" alt="">`:initials(p.name);
  var bal = p.balance ? `<div class="bal ${p.balance>0?'due':''}">${p.balance>0?'owes ':''}₱${Math.abs(+p.balance).toLocaleString()}</div>` : '';
  var role = p.role==='youth' ? `<span class="role">YOUTH${p.age?(' · '+esc(p.age)):''}</span>` : '';
  var catBadge = `<span class="badge" style="background:${catColor(p.category)}">${esc(FAE.directoryCatLabel(p.category))}</span>`;
  var deps = (p.dependents||[]).length
    ? `<div class="deps"><div class="undertag">&#9662; ${p.dependents.length} UNDER THIS GUARDIAN</div>${p.dependents.map(depRow).join('')}</div>`
    : '';
  return `<div class="card" data-k="${p.key}">
      <div class="head" onclick="toggle(this)">
        <div class="pic">${pic}</div>
        <div class="who"><b>${esc(p.name)}</b>${role}
          <div class="id">${esc(p.id)}</div>
          <div class="badges">${catBadge}${activityBadges(p.activities)}</div>
        </div>
        ${bal}<span class="chev">&#9656;</span>
      </div>
      <div class="contact" hidden>${contactBlock(p)}${catSelect(p)}</div>
      ${deps}
    </div>`;
}

function toggle(head){
  var c = head.parentNode.querySelector('.contact');
  if(c){ c.hidden = !c.hidden; head.querySelector('.chev').innerHTML = c.hidden ? '&#9656;' : '&#9662;'; }
}
function setCat(key,val){ FAE.directorySetCategory(key,val); render(); toast('Category updated'); }

function data(){ try{ return FAE.directory(); }catch(e){ return []; } }

function renderChips(){
  var list = data();
  /* count people per category, adults + nested youth */
  var counts = { all:0 };
  function bump(p){ counts.all++; counts[p.category]=(counts[p.category]||0)+1; }
  list.forEach(p=>{ bump(p); (p.dependents||[]).forEach(bump); });
  var opts = [{key:'all',label:'All'}].concat(catOptions());
  $('chips').innerHTML = opts.map(o=>{
    var on = FILTER===o.key, col = o.key==='all'?'var(--gold)':catColor(o.key);
    return `<span class="chip${on?' on':''}" ${on?`style="background:${col}"`:''} onclick="FILTER='${o.key}';render()">
        ${o.key!=='all'?`<span class="dot" style="background:${col}"></span>`:''}${esc(o.label)}
        <span class="n">${counts[o.key]||0}</span></span>`;
  }).join('') + `<span class="chip add" onclick="addCat()">&#43; New category</span>`;
}

function visibleCards(){
  var q = ($('q').value||'').toLowerCase().trim();
  return data().filter(p=>matches(p,q) && inFilter(p));
}
function render(){
  renderChips();
  var list = visibleCards(), all = data();
  var total = all.reduce((n,p)=>n+1+(p.dependents||[]).length,0);
  $('count').textContent = list.length+' of '+total+' people';
  $('grid').innerHTML = list.length ? list.map(card).join('')
    : `<div class="empty">No one matches.<br><span style="font-size:12px">Members, court visitor households and FilAm Elite players all appear here once they're in the system.</span></div>`;
}

function addCat(){
  var label = prompt('New category name (e.g. "Pickleball League", "NXGEN Tryouts"):');
  if(!label) return;
  var key = FAE.directoryAddCat(label);
  if(key){ toast('Added "'+label+'"'); render(); }
}

/* ---- export (no photos, no child health notes; contact + category only) ---- */
function exportRows(){
  var out = [];
  data().forEach(p=>{
    out.push({ ID:p.id, Name:p.name, Role:'adult', Category:FAE.directoryCatLabel(p.category),
      Activities:(p.activities||[]).join(' | '), Phone:p.phone||'', Email:p.email||'', Address:p.address||'',
      Guardian:'', Balance:p.balance||'' });
    (p.dependents||[]).forEach(d=>out.push({ ID:d.id, Name:d.name, Role:'youth',
      Category:FAE.directoryCatLabel(d.category), Activities:(d.activities||[]).join(' | '),
      Phone:d.phone||'', Email:d.email||'', Address:d.address||'', Guardian:p.name, Balance:d.balance||'' }));
  });
  return out;
}
FAEExport.define('portal',{ label:'Member Portal', file:'member-portal', sheet:'DIRECTORY',
  rows:exportRows, formats:['csv','xls','folder'] });

function copyAll(){
  var lines = exportRows().map(r=>`${r.Name}\t${r.Role}\t${r.Category}\t${r.Phone}\t${r.Email}\t${r.Guardian}`);
  var text = 'Name\tRole\tCategory\tPhone\tEmail\tGuardian\n'+lines.join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(()=>toast(lines.length+' people copied'),()=>toast('Copy failed'));
  else toast('Clipboard not available');
}

(function(){
  var r=FAE.role();
  $('roleNote').innerHTML = (r
    ? `Signed in as <b style="color:var(--gold-hi)">${r.toUpperCase()}</b>. `
    : `<b style="color:var(--gold-hi)">Reference directory.</b> `)
    + `Click anyone to see their contact details. Minors appear <b>under their guardian</b>. Contact info and children's details are personal data — keep them on the office computer.`;
  render();
})();
</script>
<script src="assets/fae-motion.js?v=1"></script>
</body>
</html>
